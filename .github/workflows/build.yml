name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Use an available hosted runner, but compile inside Ubuntu 20.04 so the
    # resulting binary only requires glibc 2.31 (SteamRuntime compatible).
    runs-on: ubuntu-24.04
    container: ubuntu:20.04

    steps:
      - name: Install build tools
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake g++ make protobuf-compiler

      - name: Checkout plugin
        uses: actions/checkout@v5

      - name: Download Metamod and CS2 SDK
        shell: bash
        run: |
          mkdir -p deps
          git clone --depth 1 --branch 2.0.0.1411 --recurse-submodules \
            https://github.com/alliedmodders/metamod-source.git deps/metamod-source
          git clone --depth 1 --branch v1.20.1 --recurse-submodules \
            https://github.com/Source2ZE/CS2Fixes.git deps/cs2fixes

      - name: Test weapon restrictions
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/weapon_policy.cpp -o /tmp/snowball-weapon-test
          /tmp/snowball-weapon-test

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMETAMOD_SOURCE="$PWD/deps/metamod-source" \
            -DHL2SDK_CS2="$PWD/deps/cs2fixes/sdk"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 2>&1 | tee build.log

      - name: Add compiler error to summary
        if: failure()
        shell: bash
        run: |
          if [ ! -f build.log ]; then
            echo 'Build log was not created; configuration failed before compilation.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Compiler output'
            echo '```text'
            tail -n 200 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 build.log | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            echo "::warning title=Compiler::$line"
          done

      - name: Package
        run: cmake --install build --config Release --prefix package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: snowball-round-linux
          path: package
          if-no-files-found: error
