name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5

      - name: Checkout Metamod 1411
        uses: actions/checkout@v5
        with:
          repository: alliedmodders/metamod-source
          ref: 2.0.0.1411
          path: deps/metamod-source
          submodules: recursive

      - name: Checkout the matching CS2 SDK
        uses: actions/checkout@v5
        with:
          repository: Source2ZE/CS2Fixes
          ref: v1.20.1
          path: deps/cs2fixes
          submodules: recursive

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMETAMOD_SOURCE="${{ github.workspace }}/deps/metamod-source"
          -DHL2SDK_CS2="${{ github.workspace }}/deps/cs2fixes/sdk"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 2>&1 | tee build.log

      - name: Add compiler error to summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## Compiler output'
            echo '```text'
            tail -n 200 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: cmake --install build --config Release --prefix package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: snowball-round-linux
          path: package
          if-no-files-found: error
